name: Build QMK firmware
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    uses: qmk/.github/.github/workflows/qmk_userspace_build.yml@main
    permissions:
      contents: write
    with:
      qmk_repo: qmk/qmk_firmware
      qmk_ref: master
      preparation_command: cp -r keyboards/. qmk_firmware/keyboards/
  # remappr:release: attaches the firmware to the GitHub Release of a v* tag.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: firmware
          merge-multiple: true
      - name: Attach the firmware to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s globstar nullglob
          files=(firmware/**/*.uf2 firmware/**/*.hex firmware/**/*.bin)
          [ ${#files[@]} -gt 0 ] || { echo "No firmware files were built."; exit 1; }
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes ""
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
